speech_config:
  sample_rate: 16000
  frame_ms: 25
  stride_ms: 10
  num_feature_bins: 80
  feature_type: log_mel_spectrogram
  preemphasis: 0.97
  normalize_signal: True
  normalize_feature: True
  normalize_per_feature: False
  use_fma: True
  use_neon: False

model_config:
  name: acrnn
  d_model: 64
  filters: [32,64,64]
  kernel_size: [[11,5],[11,5],[11,5]]
  rnn_cell: 256
  seq_mask: True
  num_languages: 100

dataset_config:
  vocabulary: vocab/vocab.txt
  data_path: ./data/wavs/
  corpus_name: ./data/multilingual/
  file_nums: 1
  max_audio_length: 2000
  shuffle_size: 1200
  data_length: None
  suffix: .txt
  load_type: multilingual
  train: train
  dev: dev
  test: test
  languages_file: configs/languages.json
  max_samples_per_language: 10000

optimizer_config:
  init_steps: 0
  warmup_steps: 10000
  max_lr: 1e-4
  beta1: 0.9
  beta2: 0.999
  epsilon: 1e-9
  use_mixed_precision: True

running_config:
  prefetch: True
  load_weights: ./saved_weights/multilingual/last/model
  num_epochs: 100
  batch_size: 32
  train_steps: 1000
  dev_steps: 100
  test_steps: 100
  save_interval: 5
  eval_interval: 1